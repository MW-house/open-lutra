# Recording configuration (default: simulator)
#
# Set RECORDING_CONFIG=config/simulator.yaml in .env to use this file.
# Use it as a template for a physical robot: copy to e.g. config/myrobot.yaml,
# adjust ros_domain_id / topic names / expected Hz / stamp_quality /
# recording_start_delay_sec, then repoint RECORDING_CONFIG at the new file.

robot_name: RobotSimulator
ros_domain_id: 0
recording_discovery_timeout: 10
monitor_qos_depth: 30

# Compute live-quality missing_rate based on header.stamp.
# - true:  detect loss accurately from stamp intervals. Use this for a physical
#          robot, whose stamps typically have very low jitter.
# - false: compute by count (received / expected). Use this for simulators,
#          whose stamps include OS timer jitter.
stamp_quality: false

# Additional wait (seconds) after DDS discovery completes before SPACE is sent
# to actually start recording. RealSense camera drivers and similar can have
# ~1s lag between subscribe confirmation and the first frame; a non-zero value
# waits for publisher ramp-up to eliminate the blank period at the start of
# recordings. Leave at 0 for simulators; set to e.g. 2.0 for physical robots
# with slow-starting camera drivers.
recording_start_delay_sec: 0

# Default topics to record (pre-selected in the UI)
default_topics:
  - /chest_depth_cam/color/image_raw/compressed
  - /head_depth_cam/color/image_raw/compressed
  - /left_arm_depth_cam/color/image_raw/compressed
  - /sim/slave_arm_left
  - /sim/slave_arm_left/gripper
  - /sim/slave_arm_left/pose
  - /sim/master_arm_left
  - /sim/master_arm_left/hand

# Builtin validators run after each recording completes.
# Each entry must have a `name` matching a builtin validator; remaining fields
# are passed as arguments to that validator's constructor.
validators:
  - name: required_topics_present
    topics:
      - /chest_depth_cam/color/image_raw/compressed
      - /head_depth_cam/color/image_raw/compressed
      - /left_arm_depth_cam/color/image_raw/compressed
      - /sim/slave_arm_left
      - /sim/slave_arm_left/gripper
      - /sim/slave_arm_left/pose
      - /sim/master_arm_left
      - /sim/master_arm_left/hand
  - name: total_duration_sec
    min_sec: 5
    max_sec: 30

# Expected Hz for quality evaluation (pattern match, first match wins). Used by
# both live monitoring and the post-recording quality report: a matching `hz`
# becomes the topic's expected frequency and the loss-rate denominator.
# Omit `hz` to auto-derive the expected frequency from the measured message
# intervals instead (live monitoring learns it after subscribe; the report
# snaps the measured rate to the nearest standard frequency). Example:
#   - pattern: "/sensor/*"   # no hz: auto-derived
expected_hz_patterns:
  - pattern: "**/compressed"
    hz: 30
  - pattern: "/sim/**"
    hz: 100

# Pre-registered metadata fields shown before recording (the "Metadata" panel in
# the recording bar). Operators set a value for each field; the selection sticks
# across recordings (like the task name) until changed and is written into each
# recording's recording_meta.json under `metadata`. Values are always stored as
# strings, so a zero-padded id like "007" keeps its leading zeros.
# Omit this whole section (or leave it empty) to hide the panel and disable it.
#
# `type` selects the input control (default: select):
#   - select: pick from `options` (required for this type).
#   - number: free numeric input, restricted to digits (stored as a string, so
#             leading zeros are preserved). Use `pattern` for extra rules.
#   - text:   free text input.
# `pattern` is an optional regex the value must match (invalid input is flagged
# in the UI). `placeholder` is an optional input hint.
#
# Fields below are the MW pilot master. Each select option follows the master
# convention "{prefix}{3-digit id}_{name}": the stored `value` is the stable
# code ("A000") and the `label` is the human display ("A000_フェイスタオル").
# The code stays ASCII/language-independent in recording_meta.json, while the
# name/category master is resolved from this config. Prefixes: A=object,
# B=object condition, C=initial placement, D=operation.
metadata_fields:
  # A. Object being handled.
  - key: object
    label: "対象物"
    type: select
    options:
      - value: A000
        label: "A000_フェイスタオル"
      - value: A001
        label: "A001_バスタオル"
      - value: A002
        label: "A002_Tシャツ"
      - value: A003
        label: "A003_下着"
      - value: A004
        label: "A004_靴下"
      - value: A005
        label: "A005_長ズボン"
      - value: A006
        label: "A006_ジーンズ"
      - value: A007
        label: "A007_子供服"
      - value: A008
        label: "A008_スウェット"

  # B. Condition of the object.
  - key: object_condition
    label: "対象物状態"
    type: select
    options:
      - value: B000
        label: "B000_乾燥"
      - value: B001
        label: "B001_湿り"
      - value: B002
        label: "B002_シワあり"
      - value: B003
        label: "B003_裏返し"

  # C. Initial placement of the object.
  - key: initial_placement
    label: "初期配置"
    type: select
    options:
      - value: C000
        label: "C000_平置き"
      - value: C001
        label: "C001_山積み"
      - value: C002
        label: "C002_洗濯カゴ"
      - value: C003
        label: "C003_絡まり"

  # D. Operation performed.
  - key: operation
    label: "操作"
    type: select
    options:
      - value: D000
        label: "D000_片手で持ち上げる"
      - value: D001
        label: "D001_両手で保持する"
      - value: D002
        label: "D002_端を探す"
      - value: D003
        label: "D003_角を探す"
      - value: D004
        label: "D004_振る"
      - value: D005
        label: "D005_広げる"
      - value: D006
        label: "D006_シワを伸ばす"
      - value: D007
        label: "D007_表裏を反転する"
      - value: D008
        label: "D008_向きを揃える"
      - value: D009
        label: "D009_広がった状態から洗濯物を畳む"
      - value: D010
        label: "D010_畳んだ衣類を置く"
      - value: D011
        label: "D011_同種を積む"
      - value: D012
        label: "D012_崩れないように整列する"
      - value: D013
        label: "D013_Short Task"
      - value: D014
        label: "D014_End-to-End"
      - value: D015
        label: "D015_バッファ"

  # Operator ID. 3-digit sequential code; the operator name / experience is kept
  # in a separate master. Digits only, stored as a string so "007" keeps its
  # leading zeros.
  - key: operator_id
    label: "オペレータID"
    type: number
    pattern: '^[0-9]{3}$'
    placeholder: "e.g. 000"

  # Task evaluation. Success / failure; the stored value stays ASCII.
  - key: task_evaluation
    label: "タスク評価"
    type: select
    options:
      - value: success
        label: "成功"
      - value: failure
        label: "失敗"

  # NOTE: "failure_reason" (multi-select) is intentionally deferred — the
  # metadata feature does not yet support multi-select, and the concrete list of
  # reasons is not finalized. Add it once both are settled.

# LeRobot dataset export mapping (used by the "Export to LeRobot" action on
# /recordings). Declares how this robot's MCAP topics map to LeRobot v3.0
# features. Omit this whole section to disable export for the robot.
lerobot_export:
  # Output video frame rate. 0 = auto-detect from the first image topic's
  # message interval. (optional, default: 0)
  fps: 30

  # Free-form robot identifier written to the dataset's meta/info.json.
  # (optional, default: "custom")
  robot_type: robot_simulator

  # Maximum time gap (ms) allowed when aligning state/action samples across
  # topics. Samples farther apart than this are not paired. (optional, default: 50)
  sync_tolerance_ms: 50.0

  # Maximum time gap (ms) allowed when aligning image frames to the sync grid.
  # (optional, default: 200)
  image_tolerance_ms: 200.0

  # How to determine the episode time span when sources have different durations.
  # "intersection": use only the period covered by all sources (safest).
  # "union":        extend to the full span of any source (pads missing samples).
  # (optional, default: "intersection")
  time_range: intersection

  # Required. Maps camera names to image topics.
  # Each entry becomes observation.images.<camera_name> in the dataset.
  images:
    chest: /chest_depth_cam/color/image_raw/compressed
    head:  /head_depth_cam/color/image_raw/compressed
    left_arm: /left_arm_depth_cam/color/image_raw/compressed

  # Required. Maps LeRobot field names to one or more source topics.
  # Each field becomes observation.<field_name> in the dataset.
  # Multiple sources under one field are concatenated in declaration order.
  #
  # type must be one of: list | number | struct
  #   list   → numeric sequence; indices selects elements (required).
  #   number → scalar float/int; becomes a 1-element array automatically.
  #   struct → named-field object; keys lists sub-field names to extract (required).
  observation:
    # --- type: list ---
    # sensor_msgs/JointState: {"name": ["joint1", ...], "position": [-0.858, -1.287, 1.582, ...]}
    state:
      - topic: /sim/slave_arm_left
        type: list
        field: position
        indices: [0, 1, 2, 3, 4, 5, 6]

    # --- type: number ---
    # std_msgs/Float64: {"data": 0.033}
    gripper:
      - topic: /sim/slave_arm_left/gripper
        type: number
        field: data

    # --- type: struct ---
    # geometry_msgs/Point: {"x": -0.183, "y": 0.481, "z": 0.274}
    ee_pos:
      - topic: /sim/slave_arm_left/pose
        type: struct
        keys: [x, y, z]

  # Required. Same source format and concatenation rules as observation.
  # All sources are concatenated into one flat action vector.
  #
  # sensor_msgs/JointState: {"position": [-49517.0, -74117.0, ...]}  (encoder counts)
  # std_msgs/Float64: {"data": 0.51}
  action:
    - topic: /sim/master_arm_left
      type: list
      field: position
      indices: [0, 1, 2, 3, 4, 5, 6]
    - topic: /sim/master_arm_left/hand
      type: number
      field: data
