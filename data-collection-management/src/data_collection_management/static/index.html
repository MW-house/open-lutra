<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>収録データ集計</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>収録データ集計</h1>
      <div class="header-range">
        <input id="date-from" type="date" aria-label="開始日" />
        <span class="range-separator">〜</span>
        <input id="date-to" type="date" aria-label="終了日" />
        <div class="presets">
          <button class="ghost" type="button" data-preset="today">今日</button>
          <button class="ghost" type="button" data-preset="7">過去7日</button>
          <button class="ghost" type="button" data-preset="30">過去30日</button>
          <button class="ghost" type="button" data-preset="all">全期間</button>
        </div>
      </div>
      <div class="header-actions">
        <span id="aggregated-at" class="muted"></span>
        <button id="aggregate" class="primary" type="button">集計</button>
      </div>
    </header>

    <main class="main">
      <p id="error" class="error" hidden></p>

      <section class="panel">
        <div class="panel-head">
          <h2>絞り込み</h2>
          <button id="reset-filters" class="ghost" type="button">条件をクリア</button>
        </div>
        <div id="filters" class="filters"></div>
        <p class="muted" id="paths"></p>
      </section>

      <section class="totals" id="totals"></section>

      <section id="summaries" class="summaries"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>該当データ一覧</h2>
          <button id="toggle-recordings" class="ghost" type="button">表示</button>
        </div>
        <div id="recordings" hidden></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
